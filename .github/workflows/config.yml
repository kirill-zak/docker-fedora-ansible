---
name: Configuration

on:
  workflow_call:
    outputs:
      versions:
        description: JSON array of supported versions
        value: ${{ jobs.config.outputs.versions }}
      platforms:
        description: JSON array of supported platforms
        value: ${{ jobs.config.outputs.platforms }}
      latest_version:
        description: Version carrying the latest tag
        value: ${{ jobs.config.outputs.latest_version }}

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.values.outputs.versions }}
      platforms: ${{ steps.values.outputs.platforms }}
      latest_version: ${{ steps.values.outputs.latest_version }}
    steps:
      - id: values
        run: |
          {
            echo 'versions=["35","36","37","38","39","40","41","42"]'
            echo 'platforms=["linux/amd64","linux/arm64","linux/ppc64le","linux/s390x"]'
            echo 'latest_version=42'
          } >> "$GITHUB_OUTPUT"